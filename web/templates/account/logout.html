{% extends "base/_base.html" %}

{% block title %}Sair | Comuna Bristol{% endblock %}

{% block body_class %}bg-slate-50{% endblock %}

{% block content %}
  <section class="px-4 py-12 sm:px-6 lg:px-8">
    <div class="mx-auto max-w-md rounded-2xl border border-slate-200 bg-white p-6 text-center shadow-xl shadow-slate-200/70 sm:p-8">
      <div class="mx-auto flex h-12 w-12 items-center justify-center rounded-2xl bg-blue-50 text-blue-700">
        <svg class="h-6 w-6" aria-hidden="true" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.75 9V5.25A2.25 2.25 0 0 0 13.5 3h-6A2.25 2.25 0 0 0 5.25 5.25v13.5A2.25 2.25 0 0 0 7.5 21h6a2.25 2.25 0 0 0 2.25-2.25V15m3 0 3-3m0 0-3-3m3 3H9" /></svg>
      </div>
      <h1 class="mt-6 text-3xl font-bold tracking-tight text-slate-950">Sair do sistema?</h1>
      <p class="mt-3 text-sm leading-6 text-slate-600">Você será desconectado da área de gestão de membros.</p>

      <form method="post" action="{% url 'account_logout' %}" class="mt-8 space-y-3">
        {% csrf_token %}
        {{ redirect_field }}
        <button type="submit" class="w-full rounded-lg bg-blue-700 px-5 py-3 text-sm font-semibold text-white shadow-lg shadow-blue-700/20 hover:bg-blue-800 focus:outline-none focus:ring-4 focus:ring-blue-200">Confirmar saída</button>
        <a href="{% url 'home' %}" class="inline-flex w-full items-center justify-center rounded-lg border border-slate-200 bg-white px-5 py-3 text-sm font-semibold text-slate-700 hover:bg-slate-50 focus:outline-none focus:ring-4 focus:ring-blue-100">Voltar ao início</a>
      </form>
    </div>
  </section>
{% endblock %}
