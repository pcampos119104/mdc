{% load static %}

<header class="border-b border-slate-200 bg-white/90 backdrop-blur">
  <div class="mx-auto flex max-w-7xl items-center justify-between gap-4 px-4 py-4 sm:px-6 sm:py-5 lg:px-8">
    <a href="{% url 'home' %}" class="flex items-center gap-3" aria-label="Comuna Bristol">
      <span class="flex h-12 w-12 shrink-0 items-center justify-center overflow-hidden rounded-2xl bg-white shadow-sm ring-1 ring-slate-200 sm:h-14 sm:w-14">
        <img src="{% static 'img/comuna-bristol-logo.webp' %}" alt="Comuna Bristol" class="h-full w-full object-cover">
      </span>
      <span class="text-sm font-semibold text-slate-950 sm:text-base">Gestão de Membros</span>
    </a>

    <nav class="flex items-center gap-3" aria-label="Acesso principal">
      {% if user.is_authenticated %}
        <a href="{% url 'members:list' %}" class="hidden rounded-lg px-3 py-2 text-sm font-medium text-slate-700 hover:bg-slate-50 focus:outline-none focus:ring-4 focus:ring-blue-100 sm:inline-flex">Membros</a>
        {% if user.is_staff or user.is_superuser %}
          <a href="{% url 'birthdays:settings' %}" class="hidden rounded-lg px-3 py-2 text-sm font-medium text-slate-700 hover:bg-slate-50 focus:outline-none focus:ring-4 focus:ring-blue-100 sm:inline-flex">Aniversariantes</a>
          <a href="{% url 'christmas:event_list' %}" class="hidden rounded-lg px-3 py-2 text-sm font-medium text-slate-700 hover:bg-slate-50 focus:outline-none focus:ring-4 focus:ring-blue-100 sm:inline-flex">Natal Feliz</a>
        {% endif %}
        <div class="relative" x-data="{ accountMenuOpen: false }" @click.outside="accountMenuOpen = false" @keydown.escape.window="accountMenuOpen = false">
          <button
            type="button"
            class="inline-flex items-center gap-2 rounded-lg border border-slate-200 bg-white px-3 py-2 text-sm font-medium text-slate-700 shadow-sm hover:bg-slate-50 focus:outline-none focus:ring-4 focus:ring-blue-100 sm:px-4"
            @click="accountMenuOpen = !accountMenuOpen"
            :aria-expanded="accountMenuOpen.toString()"
            aria-haspopup="true"
            aria-controls="account-menu"
          >
            <span>Minha conta</span>
            <svg class="h-4 w-4" aria-hidden="true" viewBox="0 0 20 20" fill="currentColor">
              <path fill-rule="evenodd" d="M5.22 7.22a.75.75 0 0 1 1.06 0L10 10.94l3.72-3.72a.75.75 0 1 1 1.06 1.06l-4.25 4.25a.75.75 0 0 1-1.06 0L5.22 8.28a.75.75 0 0 1 0-1.06Z" clip-rule="evenodd"></path>
            </svg>
          </button>

          <div
            id="account-menu"
            x-cloak
            x-show="accountMenuOpen"
            x-transition
            class="absolute right-0 z-20 mt-2 w-64 overflow-hidden rounded-xl border border-slate-200 bg-white shadow-lg"
          >
            <div class="border-b border-slate-100 px-4 py-3">
              <p class="text-xs font-medium uppercase tracking-wide text-slate-500">Conectado como</p>
              <p class="mt-1 truncate text-sm font-medium text-slate-900">{{ user.email|default:user.username }}</p>
            </div>
            <div class="p-2">
              <a href="{% url 'account_change_password' %}" class="block rounded-lg px-3 py-2 text-sm font-medium text-slate-700 hover:bg-slate-50 focus:outline-none focus:ring-2 focus:ring-blue-100">Alterar senha</a>
              <a href="{% url 'account_logout' %}" class="block rounded-lg px-3 py-2 text-sm font-medium text-slate-700 hover:bg-slate-50 focus:outline-none focus:ring-2 focus:ring-blue-100">Sair</a>
            </div>
          </div>
        </div>
      {% else %}
        <a href="{% url 'account_login' %}" class="rounded-lg border border-slate-200 bg-white px-3 py-2 text-sm font-medium text-slate-700 shadow-sm hover:bg-slate-50 focus:outline-none focus:ring-4 focus:ring-blue-100 sm:px-4">Entrar</a>
      {% endif %}
    </nav>
  </div>
</header>
