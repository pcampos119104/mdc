<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <title>Etiquetas — {{ event.name }}</title>
    <style>
      @page {
        size: A4 portrait;
        margin: 10mm;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        font-family: Arial, sans-serif;
        color: #000;
      }

      .label-sheet {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        grid-template-rows: repeat(3, minmax(0, 1fr));
        gap: 5mm;
        width: 100%;
        height: 276mm;
        break-after: page;
      }

      .label-sheet:last-child {
        break-after: auto;
      }

      .sponsorship-label {
        display: flex;
        flex-direction: column;
        justify-content: center;
        border: 1px solid #000;
        padding: 10mm;
        break-inside: avoid;
      }

      .sponsorship-label p {
        margin: 0 0 5mm;
        font-size: 16pt;
        line-height: 1.3;
        overflow-wrap: anywhere;
      }

      .sponsorship-label p:last-child {
        margin-bottom: 0;
      }

      .sponsorship-label strong {
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    {% for page in pages %}
      <section class="label-sheet">
        {% for label in page %}
          <article class="sponsorship-label">
            <p><strong>ID:</strong> {{ label.id }}</p>
            <p><strong>Padrinho:</strong> {{ label.sponsor_name }}</p>
            <p><strong>Criança:</strong> {{ label.child_name }}</p>
            {% if event.label_note %}
              <p><strong>Observação:</strong> {{ event.label_note }}</p>
            {% endif %}
          </article>
        {% endfor %}
      </section>
    {% endfor %}
  </body>
</html>
