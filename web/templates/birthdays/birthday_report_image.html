<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <style>{{ tailwind_css|safe }}</style>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; background: #e2e8f0; font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .report-shell { width: 820px; background: #f8fafc; color: #0f172a; }
      .member-row:last-child { border-bottom: 0; }
      .member-name { overflow-wrap: anywhere; }
    </style>
  </head>
  <body>
    <main id="birthday-report-image" class="report-shell p-10">
      <section class="overflow-hidden rounded-3xl border border-slate-200 bg-white shadow-xl shadow-slate-300/50">
        <div class="bg-gradient-to-br from-blue-700 via-blue-600 to-sky-500 px-8 py-8 text-white">
          <p class="text-sm font-semibold uppercase tracking-[0.35em] text-blue-100">Comuna Bristol</p>
          <h1 class="mt-3 text-4xl font-black tracking-tight">Aniversariantes da semana</h1>
          <p class="mt-3 text-lg font-medium text-blue-50">{{ period_start|date:"d/m/Y" }} a {{ period_end|date:"d/m/Y" }}</p>
        </div>

        <div class="px-8 py-6">
          <ul role="list" class="divide-y divide-slate-200">
            {% for entry in entries %}
              <li class="member-row flex items-center gap-5 border-b border-slate-200 py-5">
                <img src="{{ entry.photo_data_url }}" alt="Foto de {{ entry.name }}" class="h-24 w-24 shrink-0 rounded-2xl object-cover ring-4 ring-blue-50">
                <div class="min-w-0 flex-1">
                  <p class="member-name text-3xl font-black leading-tight tracking-tight text-slate-950">{{ entry.name }}</p>
                  <p class="mt-2 text-xl font-semibold text-blue-700">{{ entry.birthday_occurrence|date:"d/m" }}</p>
                </div>
              </li>
            {% endfor %}
          </ul>
        </div>
      </section>
    </main>
  </body>
</html>
