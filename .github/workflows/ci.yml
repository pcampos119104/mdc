name: CI

env:
  DOCKER_BUILDKIT: 1
  COMPOSE_DOCKER_CLI_BUILD: 1

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code repository
        uses: actions/checkout@v4

      - name: Add just
        uses: extractions/setup-just@v2

      - name: Create env file
        run: |
          {
            echo "DJANGO_SECRET_KEY=ci-secret-key"
            echo "DJANGO_DEBUG=1"
            echo "DJANGO_ALLOWED_HOSTS=localhost,127.0.0.1,*"
            echo "DATABASE_NAME=postgres"
            echo "DATABASE_USER=postgres"
            echo "DATABASE_PASSWORD=postgres"
            echo "DATABASE_HOST=db"
            echo "DATABASE_PORT=5432"
          } > .env

      - name: Build the stack
        run: just build

      - name: Start the stack
        run: just up

      - name: Wait for database
        run: just wait-db

      - name: Run DB migrations
        run: just mng migrate

      - name: Run tests
        run: just test

      - name: Tear down the stack
        if: always()
        run: just down
